name: Build MSI

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release
        required: true
  push:
    tags:
      - "*"
permissions:
  contents: write
env:
  RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  msi:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Download sail.exe
        id: download_exe
        shell: bash
        run: |
          for attempt in {1..30}; do
            if gh release download "$RELEASE_VERSION" -p '*windows_amd64*.zip'; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              exit 1
            fi
            echo "Release asset for $RELEASE_VERSION is not ready yet; retrying in 30 seconds"
            sleep 30
          done
          printf "zip=%s\n" *.zip >> $GITHUB_OUTPUT
          unzip -j -o *.zip && rm -v *.zip
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Prepare PATH
        id: setupmsbuild
        uses: microsoft/setup-msbuild@v1.3.1

      - name: Build MSI
        id: buildmsi
        shell: bash
        env:
          ZIP_FILE: ${{ steps.download_exe.outputs.zip }}
          MSBUILD_PATH: ${{ steps.setupmsbuild.outputs.msbuildPath }}
        run: |
          name="$(basename "$ZIP_FILE" ".zip")_unsigned"
          version="${RELEASE_VERSION#v}"
          version="${version%%-*}"
          "${MSBUILD_PATH}\MSBuild.exe" ./build/windows/sail.wixproj -p:SourceDir="$PWD" -p:OutputPath="$PWD" -p:OutputName="$name" -p:ProductVersion="$version"
          printf "msi=%s\n" "$PWD/$name.msi" >> "$GITHUB_OUTPUT"

      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sailpoint.msi
          path: ${{ steps.buildmsi.outputs.msi }}
    
